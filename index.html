<!DOCTYPE html>
<html>
<head>
  <title>MotherNest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fffaf5;
      color: #3d3d3d;
      text-align: center;
    }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffd6e2;
      padding: 25px 20px;
      box-sizing: border-box;
    }

    .banner h1 {
      margin: 0;
      color: #c94f76;
      font-size: 36px;
    }

    .banner p {
      margin: 8px 0 0;
      color: #7a3b55;
      font-size: 16px;
    }

    .banner-side {
      font-size: 28px;
      min-width: 70px;
    }

    .welcome {
      text-align: center;
      padding: 45px 20px;
      background: #fff5f8;
      border-radius: 25px;
      margin: 25px auto;
      max-width: 800px;
    }

    .welcome h2 {
      color: #c94f76;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #7a3b55;
      font-size: 17px;
      margin-bottom: 25px;
    }

    .welcome-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .welcome-buttons button {
      background: #d95b83;
      color: white;
      border: none;
      padding: 13px 24px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="banner">
    <div class="banner-side">♡ ♥ ♡</div>

    <div>
      <h1>MotherNest</h1>
      <p>A place where mothers, babies, and communities grow together.</p>
    </div>

    <div class="banner-side">🌱</div>
  </div>

  <section class="welcome">
    <h2>Welcome to MotherNest 💗</h2>
    <p>A safe, supportive place for mothers, babies, and growing families.</p>

    <div class="welcome-buttons">
      <button>Get Started</button>
      <button>Explore MotherNest</button>
    </div>
  </section>

</body>
</html>
